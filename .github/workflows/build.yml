name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug testDebugUnitTest --stacktrace
      - name: Mostrar assinatura do APK (deve ser igual em todos os builds)
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          FP=$(keytool -printcert -jarfile "$APK" | grep 'SHA256:' | head -1 | xargs)
          echo "::notice title=Assinatura do APK::$FP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TelaTV-debug-apk
          path: app/build/outputs/apk/debug/*.apk

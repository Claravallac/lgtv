name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug testDebugUnitTest --stacktrace
      - name: Conferir assinatura do APK (tem que ser a da chave fixa app/debug.keystore)
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          # O APK só tem assinatura v2/v3 (minSdk 26), que o keytool não lê: usa o apksigner do SDK.
          APKSIGNER=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner | sort -V | tail -1)
          EXPECTED=$(keytool -list -keystore app/debug.keystore -storepass android | grep 'SHA-256' | grep -oE '([0-9A-F]{2}:){31}[0-9A-F]{2}' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep 'certificate SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          echo "Chave fixa : $EXPECTED"
          echo "APK        : $ACTUAL"
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Assinatura diferente. Chave fixa=[$EXPECTED] APK=[$ACTUAL] apksigner=[$APKSIGNER]"
            exit 1
          fi
          echo "::notice::Assinatura OK: $ACTUAL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TelaTV-debug-apk
          path: app/build/outputs/apk/debug/*.apk
